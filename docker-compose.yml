services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      # Seeds the project3 database on first start (dump includes CREATE DATABASE)
      - ./database/project3.sql:/docker-entrypoint-initdb.d/project3.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Uncomment to reach the DB from the host (conflicts with a local MySQL on 3306)
    # ports:
    #   - "3306:3306"

  app:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      MYSQL_HOST: db
      ENVIRONMENT: production
    volumes:
      - ./backend/uploads/images:/app/backend/uploads/images
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
